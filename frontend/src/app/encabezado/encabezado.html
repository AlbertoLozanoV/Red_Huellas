<header class="header">

  <div class="header__brand">
    <div class="header__logo">
      <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </div>

    <h1 class="header__title">RED DE HUELLAS</h1>
  </div>

  <nav class="header__nav">

    <a routerLink="/formulario-reporte" class="btn-nav">
      REPORTE
    </a>

    @if (usuario) {

      <span class="user-greeting">
        HOLA, {{ usuario.nombre.toUpperCase() }}
      </span>

      <button
        type="button"
        class="btn-nav btn-logout"
        (click)="cerrarSesion()">

        CERRAR SESIÓN

      </button>

    } @else {

      <a routerLink="/formulario-login" class="btn-nav">
        INICIAR SESIÓN
      </a>

    }
  </nav>
</header>
